[project]
name = "analise-vendas-ecommerce"
version = "0.1.0"
description = "Análise exploratória de vendas fictícias de e-commerce com Python, Pandas e visualizações de faturamento."
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "seaborn>=0.13.2",
    "watermark>=2.6.0",
]
